    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
            {"@type": "Question", "name": "What is ECB money printing?", "acceptedAnswer": {"@type": "Answer", "text": "The ECB creates digital money when it buys bonds (quantitative easing) or lends to banks (TLTROs, refinancing operations). Its balance sheet grew from ~€2 trillion to ~€8.8 trillion between 2015 and 2022. Most new money, however, is created by commercial banks when they extend credit."}},
            {"@type": "Question", "name": "What is M3?", "acceptedAnswer": {"@type": "Answer", "text": "M3 is the broadest monetary aggregate of the eurozone: M1 (cash and sight deposits) plus M2 (short-term savings deposits) plus money-market instruments. The ECB publishes it monthly. It currently stands at about €17.6 trillion, almost four times what existed when the euro was created in 1999."}},
            {"@type": "Question", "name": "Where does the euros-per-second figure come from?", "acceptedAnswer": {"@type": "Answer", "text": "From the latest monthly M3 observations published by the ECB. The average change of the last three months is divided by the seconds in an average month. It is a linear approximation and the counter can run backwards in contracting months."}},
            {"@type": "Question", "name": "What does money printing have to do with inflation?", "acceptedAnswer": {"@type": "Answer", "text": "When more money enters the economy but goods and services do not grow at the same pace, each euro buys less. Per the official HICP, eurozone prices are now roughly 85% higher than at the end of 1996, with a typical 12-18 month lag between monetary expansion and prices."}},
            {"@type": "Question", "name": "Where does the data come from?", "acceptedAnswer": {"@type": "Answer", "text": "All data comes from the ECB Data Portal (CC BY 4.0 license). M3 uses a changing eurozone composition, and the HICP series chains the 2015=100 base with the 2025=100 base introduced in February 2026."}}
        ]
    }
    </script>
