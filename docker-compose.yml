version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eurodata}
      POSTGRES_USER: ${POSTGRES_USER:-eurodata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eurodata} -d ${POSTGRES_DB:-eurodata}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eurodata}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eurodata}
      REFRESH_TOKEN: ${REFRESH_TOKEN:-}
      ETL_CRON_HOUR: ${ETL_CRON_HOUR:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
