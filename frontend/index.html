    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
            {"@type": "Question", "name": "¿Por qué se han disparado los precios de la vivienda en España?", "acceptedAnswer": {"@type": "Answer", "text": "Porque la demanda crece y la oferta no responde. Los hogares han aumentado en 1,3 millones desde 2021 mientras los visados de obra nueva (200.000 en 2025) siguen muy por debajo del máximo de 2006 (735.000). Cuando la oferta está limitada por suelo, licencias y tasas, cualquier aumento de demanda se traslada al precio."}},
            {"@type": "Question", "name": "¿Qué pasó en 2008-2013, cuando los precios cayeron?", "acceptedAnswer": {"@type": "Answer", "text": "El índice de precios de la vivienda cayó más de un 35% entre sus máximos de 2007 y el suelo de 2013. Fue el ajuste tras una burbuja de crédito y sobreconstrucción. Hoy el índice está un 33% por encima de aquel pico, pero con una diferencia clave: entonces sobraba oferta; ahora falta."}},
            {"@type": "Question", "name": "¿Por qué sube todo de precio?", "acceptedAnswer": {"@type": "Answer", "text": "Porque cada año se crean euros nuevos (unos 15.600 por segundo) mientras la producción real no crece al mismo ritmo. Con más euros persiguiendo los mismos bienes, cada euro compra menos. Según el HICP oficial, los precios de la eurozona son hoy alrededor de un 88% más altos que en 1999."}},
            {"@type": "Question", "name": "¿De dónde salen los datos de ESProblemas?", "acceptedAnswer": {"@type": "Answer", "text": "De fuentes oficiales: Eurostat (índice de precios de la vivienda, visados, inmigración, población), INE (hogares y tamaño del hogar) y Banco Central Europeo (agregados monetarios). Todos los enlaces a las fuentes están citados en el sitio."}}
        ]
    }

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
    <div class="header-brand">
        <a href="#">
            <div class="header-logo">
                <span class="logo-icon"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="lp-g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#2e63e7"/><stop offset="1" stop-color="#ffcc00"/>
                        </linearGradient>
                    </defs>
                    <rect x="1" y="1" width="30" height="30" rx="8" fill="#0d1b3e"/>
                    <rect x="1" y="1" width="30" height="30" rx="8" stroke="url(#lp-g)" stroke-width="1.5"/>
                    <rect x="8" y="6" width="16" height="4.5" rx="2.25" fill="#ffcc00"/>
                    <path d="M10 14.5h12" stroke="#2e63e7" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
                    <text x="16" y="26.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffcc00" font-family="monospace">&#8364;</text>
                </svg></span>
                <span class="brand-main">ES</span><span class="brand-sub">Problemas</span>
            </div>
            <span class="brrr-tag">DATOS OFICIALES</span>
        </a>
    </div>
    <nav class="header-links">
        <a href="#vivienda" class="active" data-i18n="nav.housing"></a>
        <a href="#inflacion" data-i18n="nav.inflation"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="lang-toggle">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class="hero-eyebrow" data-i18n="site.eyebrow"></div>
            <h1 class="hero-headline" data-i18n="site.title"></h1>
            <p class="hero-lede" data-i18n="site.lede"></p>
        </div>
    </section>

    <section class="problem-section" id="vivienda">
        <div class="problem-inner">
            <div class="problem-head">
                <div class="problem-eyebrow" data-i18n="housing.eyebrow"></div>
                <h2 class="problem-title" data-reveal data-i18n="housing.title"></h2>
                <p class="problem-lede" data-i18n="housing.lede"></p>
            </div>

            <div class="metric-grid" id="housingMetrics"></div>

            <h3 class="block-title" data-i18n="housing.chartsTitle"></h3>
            <div class="charts-grid" id="housingCharts"></div>

            <div class="analysis-grid">
                <div class="analysis-block">
                    <h3 class="block-title" data-i18n="housing.mythsTitle"></h3>
                    <div class="myth-list" id="housingMyths"></div>
                </div>
                <div class="analysis-block">
                    <h3 class="block-title" data-i18n="housing.causesTitle"></h3>
                    <ul class="claim-list causes" id="housingCauses"></ul>
                </div>
                <div class="analysis-block">
                    <h3 class="block-title" data-i18n="housing.solutionsTitle"></h3>
                    <ul class="claim-list solutions" id="housingSolutions"></ul>
                </div>
            </div>

            <div class="sources-block">
                <h3 class="block-title" data-i18n="housing.sourcesTitle"></h3>
                <ul class="sources-list" id="housingSources"></ul>
                <p class="disclaimer" data-i18n="housing.disclaimer"></p>
            </div>
        </div>
    </section>

    <section class="problem-section alt" id="inflacion">
        <div class="problem-inner">
            <div class="problem-head">
                <div class="problem-eyebrow" data-i18n="infl.eyebrow"></div>
                <h2 class="problem-title" data-reveal>
                    <span data-i18n="infl.headline.pre"></span><br>
                    <span class="highlight" data-i18n="infl.headline.hl"></span>
                </h2>
                <p class="problem-lede" id="moneySub"></p>
            </div>

            <div class="pain-grid" id="inflationCards"></div>

            <div class="live-block">
                <div class="live-label" data-i18n="live.label"></div>
                <div class="live-note"><span data-i18n="infl.m3note"></span> <strong id="moneyAmount"></strong></div>
                <div class="counter-block">
                    <div class="counter-glow"></div>
                    <div class="hero-counter" id="heroCounter"></div>
                </div>
                <div class="rate-line">
                    <span class="rate-dot"></span>
                    <span class="rate-text">
                        <span data-i18n="rate.pre"></span>
                        <strong id="rateValue"></strong>
                        <span data-i18n="rate.post"></span>
                    </span>
                    <span class="chip" id="lastOfficialChip"></span>
                </div>
                <div class="stats-strip in-section">
                    <div class="stats-strip-item"><div class="stats-strip-label" data-i18n="stats.sec"></div><div class="stats-strip-value" id="statSec"></div></div>
                    <div class="stats-strip-item"><div class="stats-strip-label" data-i18n="stats.min"></div><div class="stats-strip-value" id="statMin"></div></div>
                    <div class="stats-strip-item"><div class="stats-strip-label" data-i18n="stats.hour"></div><div class="stats-strip-value" id="statHour"></div></div>
                    <div class="stats-strip-item"><div class="stats-strip-label" data-i18n="stats.day"></div><div class="stats-strip-value" id="statDay"></div></div>
                </div>
            </div>

            <div class="m3-header">
                <h3 class="m3-title" data-reveal data-i18n="infl.chart.title"></h3>
                <button class="info-btn" aria-label="What is M3?">
                    i
                    <div class="info-tooltip" data-i18n-html="infl.chart.info"></div>
                </button>
            </div>
            <p class="m3-sub" id="moneyChartSub"></p>
            <div class="m3-chart-wrap">
                <div class="m3-chart" id="m3Chart"></div>
                <div class="m3-years" id="m3Years"></div>
            </div>

            <div class="quote-break">
                <blockquote data-i18n="quote.text"></blockquote>
                <cite data-i18n="quote.cite"></cite>
            </div>

            <div class="inflation-section" id="inflation">
                <div class="inflation-header">
                    <h3 class="inflation-title" data-reveal>
                        <span data-i18n="infl.title.pre"></span>
                        <span class="red" data-i18n="infl.title.red"></span>
                    </h3>
                    <p class="inflation-sub" data-i18n="infl.sub"></p>
                </div>

                <div class="inflation-glass">
                    <div class="slider-block">
                        <div class="slider-year-display" id="sliderYear">1996</div>
                        <div class="slider-track-wrap">
                            <div class="slider-track-label" data-i18n="infl.sliderLabel"></div>
                            <input type="range" id="yearSlider" min="0" max="6" step="1" value="0">
                        </div>
                    </div>

                    <div class="price-grid" id="priceGrid"></div>

                    <div class="price-notes">
                        <p class="price-note" data-i18n="infl.hicpNote"></p>
                        <p class="price-note" data-i18n="infl.approxNote"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="faq-section" id="faq">
        <h2 class="faq-title" data-i18n="faq.title"></h2>
        <div id="faqList"></div>
    </div>
</main>

<footer>
    <p class="footer-main">
        <span data-i18n="footer.made"></span>
        <a href="https://www.ine.es/" target="_blank" rel="noopener">INE</a> ·
        <a href="https://ec.europa.eu/eurostat/" target="_blank" rel="noopener">Eurostat</a> ·
        <a href="https://data.ecb.europa.eu/" target="_blank" rel="noopener">BCE</a><span data-i18n="footer.license"></span>
    </p>
    <p class="footer-note" data-i18n="footer.estimate"></p>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
